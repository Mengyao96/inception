# nginx/conf/nginx.conf

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;

	server{
		#monitoring portal only for 443
		listen 443 ssl;
		listen [::]:443 ssl;

		server_name mezhang.42.fr;

		#SSL certificate location
		ssl_certificate /etc/nginx/ssl/inception.crt;
		ssl_certificate_key /etc/nginx/ssl/inception.key;
		ssl_protocols TLSv1.2 TLSv1.3;

		# to mount wordpress files
		root /var/www/wordpress;
		index index.php index.html;

		# handle normal web requests. if not found, check category, if none, error 404
		location / {
			try_files $uri $uri/ =404;
		}

		#handl PHP request. all .php files , pls go to wordpress
		location ~ \.php$ {
			include fastcgi_params;
			fastcgi_pass wordpress:9000;
			fastcgi_index index.php;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		}
	}
}
